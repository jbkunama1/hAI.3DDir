<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="hai-ui-build" content="login-v2"><title>hAI.3DDir</title>
<style>:root{--bg:#e8ecef;--p:#fff;--tx:#18222d;--line:#cbd5dc;--ac:#0f6b80;color-scheme:light}[data-theme=nacht]{--bg:#101820;--p:#1b2731;--tx:#e6edf3;--line:#405261;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui}button,input,select,textarea{font:inherit;color:inherit;background:var(--p);border:1px solid var(--line);border-radius:8px;padding:9px;min-height:44px;max-width:100%}button{cursor:pointer}button:disabled{cursor:wait;opacity:.6}.pri{background:var(--ac);color:#fff}main{max-width:1180px;margin:auto;padding:16px}header,nav,.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}header{justify-content:space-between;padding:12px}nav{padding:8px}.box{background:var(--p);border:1px solid var(--line);border-radius:12px;padding:16px;margin:16px 0}.f{display:grid;gap:10px;max-width:480px}.f label{display:grid;gap:4px}#login{max-width:380px;margin:12vh auto;padding:16px}#loginStatus{white-space:pre-wrap;min-height:3em}#loginStatus[data-error=true]{color:#c43c27}#toast{position:sticky;top:0;background:var(--ac);color:white;padding:12px;z-index:10;white-space:pre-wrap}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}.card{background:var(--p);border:1px solid var(--line);border-radius:10px;padding:12px;overflow-wrap:anywhere}.card img{max-width:100%;max-height:180px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid var(--line)}.scroll{overflow:auto}dialog{background:var(--p);color:var(--tx);border:1px solid var(--line);border-radius:12px;width:min(95vw,600px);max-height:90vh;overflow:auto}dialog::backdrop{background:#0008}pre{white-space:pre-wrap;overflow-wrap:anywhere}[hidden]{display:none!important}small{opacity:.8}</style>
<link rel="stylesheet" href="/design.css?v=restore-v1"><link rel="stylesheet" href="/controls.css?v=restore-v1">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script src="/app.js?v=login-v2" defer></script><script src="/design.js?v=restore-v1" defer></script><script src="/controls.js?v=restore-v1" defer></script></head><body>
<div id="toast" role="status" hidden></div><section id="login"><h1>hAI.3DDir</h1><form id="lf" class="f"><label>Passwort<input id="pw" type="password" autocomplete="current-password" required></label><button id="loginButton" class="pri" type="submit" disabled>Anmelden</button></form><p id="loginStatus" role="status" aria-live="polite">Login wird initialisiert …</p><small id="build">UI login-v2</small><noscript>JavaScript ist deaktiviert. Zum Anmelden bitte aktivieren.</noscript></section>
<div id="app" hidden><header><h1 id="title">hAI.3DDir</h1><select id="th" aria-label="Theme"><option value="modern">Modern</option><option value="nacht">Nacht</option></select><button id="lo">Abmelden</button></header><nav><button data-t="files">Dateien</button><button data-t="fil">Filamente</button><button data-t="adm">Admin</button></nav><main>
<section id="t-files"><div class="bar"><button id="up">⬆ Hoch</button><input id="q" type="search" placeholder="Suchen …"><button id="ub">Hochladen</button><input id="fi" type="file" multiple hidden></div><p id="cwd">/</p><div id="gr" class="grid"></div></section>
<section id="t-fil" hidden><div class="bar"><input id="fq" placeholder="Suche oder Barcode"><button id="fa">Neue Rolle</button><a href="/api/filaments/export?fmt=csv">CSV exportieren</a></div><div class="scroll"><table><thead><tr><th>Marke</th><th>Material</th><th>Farbe</th><th>Rest/Gesamt</th><th>Aktionen</th></tr></thead><tbody id="ft"></tbody></table></div></section>
<section id="t-adm" hidden><p id="as"></p><form id="sf" class="box f"><h2>Allgemein</h2><label>Titel<input id="a_ti"></label><label>Theme<select id="a_th"><option value="modern">Modern</option><option value="nacht">Nacht</option></select></label><label>Sortierung<select id="a_sb"><option value="name">Name</option><option value="size">Größe</option><option value="date">Datum</option></select></label><label>Reihenfolge<select id="a_so"><option value="asc">Aufsteigend</option><option value="desc">Absteigend</option></select></label><label>Dateiansicht<select id="a_view"><option value="icons">Symbole</option><option value="thumbs">Eingebettete Vorschaubilder</option><option value="slicer">Slicer-Daten</option></select></label><label>Upload-Limit (MB)<input id="a_mb" type="number" min="1" required></label><label>Dateiendungen<input id="a_ext"></label><label>Papierkorb<input id="a_tr" type="checkbox"></label><label>Aufbewahrung (Tage)<input id="a_td" type="number" min="0"></label><label>MCP aktiv<input id="a_me" type="checkbox"></label><button class="pri">Speichern</button><button id="cc" type="button">Slicer-Cache leeren</button></form>
<form id="pf" class="box f"><h2>Passwort</h2><input id="a_pw" type="password" autocomplete="new-password" minlength="6" required><button>Passwort ändern</button></form><div class="box"><h2>Backup</h2><a href="/api/backup">Herunterladen</a><button id="bkb">Einspielen</button><input id="bkr" type="file" accept=".zip" hidden></div><div class="box"><h2>MCP</h2><div id="mt"></div><form id="mf" class="f"><input id="mn" placeholder="Tokenname" required><label>Nur lesen<input id="mr" type="checkbox" checked></label><button>Token erzeugen</button></form><pre id="mk" hidden></pre></div></section>
</main></div><dialog id="fm"><form id="ff" class="f"><h2>Filamentrolle</h2><div id="filamentFields"></div><button class="pri">Speichern</button><button id="fx" type="button">Abbrechen</button></form></dialog></body></html>
