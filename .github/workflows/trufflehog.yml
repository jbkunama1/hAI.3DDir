name: Trufflehog Secret Scan
on: [push, pull_request]
jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Trufflehog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --debug --only-verified